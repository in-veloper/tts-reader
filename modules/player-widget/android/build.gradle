plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playerwidget'
version = '0.1.0'

android {
  namespace "expo.modules.playerwidget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // 위젯에서 화면 없이 재생을 시작하는 헤드리스 JS 서비스(WidgetPlaybackService)에 필요
  implementation "com.facebook.react:react-android"
}
